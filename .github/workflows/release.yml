name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  verify:
    name: Verify before shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build web game
        run: |
          npm ci
          npm run build

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot')"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import and test Godot project
        run: |
          set -o pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --path godot --import
          for scene in CareerTest MatchTest MatchBatchTest CharacterTest UiTest; do
            echo "::group::$scene"
            "$GODOT" --headless --path godot "res://tests/${scene}.tscn" 2>&1 \
              | grep -vE "leaked|ObjectDB|_free_rids|at: |ALSA|V-Sync|OpenGL"
            echo "::endgroup::"
          done

  package:
    name: Package artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default (`tools platform-tools`) fails: `tools` was
          # removed from the SDK repository. The runner image already ships the
          # SDK, so install only what we need, below.
          packages: ""

      - name: Install Android build-tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build web game
        run: |
          npm ci
          npm run build

      - name: Install Godot editor and export templates
        env:
          TEMPLATES_DIR: ~/.local/share/godot/export_templates
        run: |
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot')"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          python3 - <<'PY'
          import zipfile, os, shutil
          version = os.environ["GODOT_VERSION"]
          dest = os.path.expanduser(f"~/.local/share/godot/export_templates/{version}.stable")
          os.makedirs(dest, exist_ok=True)
          with zipfile.ZipFile("/tmp/templates.tpz") as z:
              for n in z.namelist():
                  if n.startswith("templates/") and not n.endswith("/"):
                      with z.open(n) as src, open(os.path.join(dest, os.path.basename(n)), "wb") as out:
                          shutil.copyfileobj(src, out)
          print("export templates installed:", len(os.listdir(dest)))
          PY

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Usar o keystore de release dos secrets."
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$HOME/release.keystore"
          else
            # Fallback: sem um keystore persistente, assina com um keystore
            # efemero. O APK instala, mas a assinatura muda em cada release, por
            # isso as atualizações exigem desinstalar primeiro. Para uma
            # identidade estavel, definir ANDROID_KEYSTORE_BASE64 e as
            # passwords correspondentes nos secrets do repositório.
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: a assinar o APK de release com um keystore efemero. Adiciona os secrets para uma assinatura estavel."
            keytool -genkeypair -v \
              -keystore "$HOME/release.keystore" \
              -storepass releasepass -alias release -keypass releasepass \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=To Be a Legend,O=TBAL,C=PT"
            echo "KEY_ALIAS=release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=releasepass" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=releasepass" >> "$GITHUB_ENV"
          fi
          {
            echo "TBAL_KEYSTORE=$HOME/release.keystore"
            echo "TBAL_KEY_ALIAS=${KEY_ALIAS:-release}"
            echo "TBAL_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "TBAL_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-releasepass}"
          } >> "$GITHUB_ENV"

      - name: Build signed Android APK (Capacitor)
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The APK wraps the real React game through Capacitor, so it ships the
          # full career mode. `cap sync` copies `dist/` into the native project.
          # The tag drives versionName, and versionCode grows monotonically so a
          # newer release installs over an older one.
          export TBAL_VERSION_NAME="${VERSION#v}"
          # versionCode = major*10000 + minor*100 + patch (v1.1.0 -> 10100).
          export TBAL_VERSION_CODE="$(python3 -c "import sys; p=(sys.argv[1].lstrip('v').split('.')+['0','0'])[:3]; print(int(p[0])*10000+int(p[1])*100+int(p[2]))" "${VERSION}")"
          npx cap sync android
          ( cd android && ./gradlew assembleRelease --no-daemon )

      - name: Export Godot builds
        run: |
          set -o pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p godot/exports/linux godot/exports/web
          "$GODOT" --headless --path godot --import
          "$GODOT" --headless --path godot --export-release "Linux" 2>&1 \
            | grep -vE "savepack|Storing File"
          "$GODOT" --headless --path godot --export-release "Web" 2>&1 \
            | grep -vE "savepack|Storing File"

      - name: Verify APK is signed
        run: |
          set -o pipefail
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Assemble archives
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x godot/exports/linux/ToBeALegend.x86_64
          mkdir -p release

          ( cd dist && zip -qr "../release/to-be-a-legend-web-${VERSION}.zip" . )
          ( cd godot/exports/web && zip -qr "../../../release/to-be-a-legend-godot-web-${VERSION}.zip" . )
          ( cd godot/exports/linux && zip -q "../../../release/to-be-a-legend-linux-${VERSION}.zip" ToBeALegend.x86_64 ToBeALegend.pck )
          cp android/app/build/outputs/apk/release/app-release.apk "release/to-be-a-legend-android-${VERSION}.apk"

          ls -lh release/

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            release/*.zip
            release/*.apk
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: To Be a Legend ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.apk
          body: |
            ## To Be a Legend ${{ steps.version.outputs.tag }}

            Jogo de carreira de futebol, em várias versões jogáveis.

            ### Telemóvel

            | Ficheiro | O que é |
            | --- | --- |
            | `to-be-a-legend-android-*.apk` | App Android com o **jogo completo** (o mesmo motor React do web, empacotado em WebView via Capacitor). Instala no telemóvel — pode ser preciso autorizar "instalar de fontes desconhecidas". |
            | `to-be-a-legend-web-*.zip` | Jogo principal (React + TypeScript). Abre no browser do telemóvel e pode ser **instalado** (Adicionar ao ecrã principal) porque é uma PWA. |
            | `to-be-a-legend-godot-web-*.zip` | Port Godot para o browser (WebAssembly), uma versão reduzida do jogo. |

            ### Computador

            | Ficheiro | O que é |
            | --- | --- |
            | `to-be-a-legend-linux-*.zip` | Port Godot 4.3 nativo para Linux x86_64. Extrai e corre `./ToBeALegend.x86_64`. |

            ### Como jogar no browser

            Extrai o zip e serve a pasta (os jogos precisam de ser servidos por HTTP, não abrir o ficheiro diretamente):

            ```bash
            npx serve .
            ```

            Para instalar no telemóvel: abre o endereço no browser e escolhe "Adicionar ao ecrã principal" (iOS Safari) ou "Instalar aplicação" (Android Chrome).

            ### iOS

            Não há ficheiro nativo para iOS: compilar para iOS exige macOS com Xcode. No iPhone e iPad, usa a versão PWA (`to-be-a-legend-web-*.zip` ou `to-be-a-legend-godot-web-*.zip`) instalada a partir do Safari.

            _Artefactos gerados automaticamente pelo GitHub Actions a partir da tag ${{ steps.version.outputs.tag }}._
