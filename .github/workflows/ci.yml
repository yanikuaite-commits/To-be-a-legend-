name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  godot:
    name: Godot (import + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot')"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import project
        run: |
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path godot --import

      - name: Run engine tests
        run: |
          set -o pipefail
          for scene in CareerTest MatchTest MatchBatchTest CharacterTest UiTest; do
            echo "::group::$scene"
            "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
              --headless --path godot "res://tests/${scene}.tscn" 2>&1 \
              | grep -vE "leaked|ObjectDB|_free_rids|at: |ALSA|V-Sync|OpenGL"
            echo "::endgroup::"
          done

  android:
    name: Android (Capacitor APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default (`tools platform-tools`) fails: `tools` was
          # removed from the SDK repository. The runner image already ships the
          # SDK, so install only what we need, below.
          packages: ""

      - name: Install Android build-tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install dependencies
        run: npm ci

      - name: Build web game and sync into the native project
        run: |
          npm run build
          npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK is signed
        run: |
          set -o pipefail
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
