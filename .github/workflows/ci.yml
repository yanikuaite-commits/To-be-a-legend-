name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  godot:
    name: Godot (import + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot')"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import project
        run: |
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path godot --import

      - name: Run engine tests
        run: |
          set -o pipefail
          for scene in CareerTest MatchTest MatchBatchTest CharacterTest UiTest; do
            echo "::group::$scene"
            "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
              --headless --path godot "res://tests/${scene}.tscn" 2>&1 \
              | grep -vE "leaked|ObjectDB|_free_rids|at: |ALSA|V-Sync|OpenGL"
            echo "::endgroup::"
          done

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Install Godot editor and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot')"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          python3 - <<'PY'
          import zipfile, os, shutil
          version = os.environ["GODOT_VERSION"]
          dest = os.path.expanduser(f"~/.local/share/godot/export_templates/{version}.stable")
          os.makedirs(dest, exist_ok=True)
          with zipfile.ZipFile("/tmp/templates.tpz") as z:
              for n in z.namelist():
                  if n.startswith("templates/") and not n.endswith("/"):
                      with z.open(n) as src, open(os.path.join(dest, os.path.basename(n)), "wb") as out:
                          shutil.copyfileobj(src, out)
          PY

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the Android SDK, JDK and keystore
        run: |
          python3 - <<'PY'
          import os
          p = os.path.expanduser("~/.config/godot/editor_settings-4.3.tres")
          os.makedirs(os.path.dirname(p), exist_ok=True)
          if not os.path.exists(p):
              open(p, "w").write('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n')
          s = open(p).read()
          vals = {
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/android_sdk_path": os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"],
              "export/android/debug_keystore": os.path.expanduser("~/debug.keystore"),
          }
          for k, v in vals.items():
              if f"{k} = " in s:
                  s = "\n".join(
                      f'{k} = "{v}"' if line.startswith(f"{k} = ") else line for line in s.splitlines()
                  ) + "\n"
              else:
                  s += f'{k} = "{v}"\n'
          open(p, "w").write(s)
          print(s)
          PY

      - name: Export debug APK
        run: |
          set -o pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p godot/exports/android
          "$GODOT" --headless --path godot --import
          "$GODOT" --headless --path godot --export-debug "Android" 2>&1 \
            | grep -vE "savepack|Storing File"
          test -f godot/exports/android/ToBeALegend.apk

      - name: Verify APK is signed
        run: |
          set -o pipefail
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose godot/exports/android/ToBeALegend.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: godot/exports/android/ToBeALegend.apk
          retention-days: 7
